<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Hotel Email Finder by Dan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1 class="text-danger">🔥 Hotel Email Scraper 🔥</h1>
    <form method="POST" class="mb-4">
        <div class="input-group">
            <input type="text" name="city" class="form-control" placeholder="Введите город (Москва, Paris)" required>
            <button type="submit" class="btn btn-danger">Найти отели и email'ы</button>
        </div>
    </form>
    
    {% if results %}
    <h3>Результаты для {{ results[0][0] }} ({{ results|length }} отелей):</h3>
    <table class="table table-striped table-dark">
        <thead>
            <tr>
                <th>Город</th>
                <th>Отель</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody>
            {% for row in results %}
            <tr>
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
                <td><a href="mailto:{{ row[2] }}">{{ row[2] }}</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <form method="POST" action="/download" style="display:inline;">
        <input type="hidden" name="city" value="{{ results[0][0] }}">
        <button type="submit" class="btn btn-success">Скачать CSV</button>
    </form>
    {% endif %}
</body>
</html>
